<meta charset="utf-8">
<title>교량 지침서 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f3f4f6;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #1c1c1e;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --accent: #2f6690;
    --accent-ink: #ffffff;
    --accent-weak: #eaf1f7;
    --good: #2f8a4e;
    --good-weak: #e6f4ea;
    --warn: #96660c;
    --warn-weak: #f5eedc;
    --bad: #b3413f;
    --bad-weak: #fbe9e8;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --sans: 'IBM Plex Sans KR', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f;
      --surface: #201b13;
      --surface-2: #291f19;
      --border: #3c3122;
      --border-strong: #55452c;
      --text: #ece3cf;
      --text-2: #ab9d80;
      --text-3: #8a7d63;
      --accent: #7fb2da;
      --accent-ink: #0f2333;
      --accent-weak: #22374a;
      --good: #72bd83;
      --good-weak: #1f3324;
      --warn: #dcac52;
      --warn-weak: #3a2e13;
      --bad: #e08a8a;
      --bad-weak: #3a2222;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f;
    --surface: #201b13;
    --surface-2: #291f19;
    --border: #3c3122;
    --border-strong: #55452c;
    --text: #ece3cf;
    --text-2: #ab9d80;
    --text-3: #8a7d63;
    --accent: #7fb2da;
    --accent-ink: #0f2333;
    --accent-weak: #22374a;
    --good: #72bd83;
    --good-weak: #1f3324;
    --warn: #dcac52;
    --warn-weak: #3a2e13;
    --bad: #e08a8a;
    --bad-weak: #3a2222;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-weak); }

  .app { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---- header ---- */
  header.top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 {
    font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em;
    text-wrap: balance;
  }
  .brand .tag {
    font-family: var(--mono); font-size: 12px; color: var(--text-3);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px;
  }
  .sub { color: var(--text-2); font-size: 13.5px; margin-top: 4px; max-width: 62ch; }

  .years { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .years .label { font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
  .year-chip {
    font-family: var(--mono); font-size: 13px; font-weight: 500;
    border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text-2); border-radius: 999px; padding: 5px 12px; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .year-chip:hover { border-color: var(--accent); }
  .year-chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ---- layout ---- */
  .layout { display: grid; grid-template-columns: 190px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

  nav.tabs {
    display: flex; flex-direction: column; gap: 3px; position: sticky; top: 20px;
  }
  @media (max-width: 720px) { nav.tabs { flex-direction: row; overflow-x: auto; position: static; } }
  nav.tabs button {
    all: unset; cursor: pointer; padding: 10px 12px; border-radius: 8px;
    font-size: 14px; font-weight: 500; color: var(--text-2);
    display: flex; align-items: center; gap: 9px; white-space: nowrap;
  }
  nav.tabs button .n { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  nav.tabs button:hover { background: var(--surface-2); color: var(--text); }
  nav.tabs button.active { background: var(--accent-weak); color: var(--accent); }
  nav.tabs button.active .n { color: var(--accent); }

  main { min-width: 0; }
  .panel { display: none; }
  .panel.active { display: block; }

  h2.panel-title { font-size: 17px; margin: 0 0 4px; font-weight: 700; }
  p.panel-desc { color: var(--text-2); font-size: 13.5px; margin: 0 0 18px; max-width: 68ch; }

  input[type=text], input[type=number], select {
    font-family: var(--sans); font-size: 14.5px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 9px 12px; outline: none;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus { border-color: var(--accent); }
  input[type=text]::placeholder { color: var(--text-3); }

  .search-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-row input { flex: 1; }

  /* ---- 표 조회 ---- */
  .anchor-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow);
  }
  .anchor-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; cursor: pointer; }
  .anchor-title { font-weight: 600; font-size: 15px; }
  .anchor-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .yr-badge {
    font-family: var(--mono); font-size: 12px; border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; color: var(--text-2); background: var(--surface-2);
  }
  .yr-badge b { color: var(--text); font-weight: 600; }
  .warn-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px;
    background: var(--warn-weak); color: var(--warn); border-radius: 6px;
    padding: 5px 9px; margin-top: 8px; font-weight: 500;
  }
  .anchor-body { display: none; margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .anchor-body.open { display: block; }
  .table-year-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .table-year-tabs button {
    all: unset; cursor: pointer; font-family: var(--mono); font-size: 12.5px;
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
    color: var(--text-2);
  }
  .table-year-tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .no-year { color: var(--text-3); font-size: 12.5px; font-style: italic; padding: 4px 0; }

  /* rendered table-kv block */
  .kv { font-size: 13.8px; }
  .kv h3 { font-size: 14.5px; margin: 0 0 8px; }
  .kv .meta-line { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
  .kv hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .kv .grade-block h4 {
    font-size: 13.5px; margin: 4px 0 6px; display: inline-flex; align-items: center; gap: 7px;
  }
  .grade-pill {
    font-family: var(--mono); font-weight: 700; font-size: 12px; border-radius: 6px;
    padding: 2px 8px; display: inline-block;
  }
  .grade-a, .grade-b { background: var(--good-weak); color: var(--good); }
  .grade-c { background: var(--warn-weak); color: var(--warn); }
  .grade-d, .grade-e { background: var(--bad-weak); color: var(--bad); }
  .kv-row { display: flex; gap: 6px; padding: 2px 0; }
  .kv-row .k { color: var(--text-3); min-width: 74px; flex-shrink: 0; }
  .kv-row .v { color: var(--text); }
  .kv-crit { color: var(--text-2); padding: 1px 0 1px 4px; }

  /* ---- 등급 판정 ---- */
  .grade-form {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-items: end;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  @media (max-width: 720px) { .grade-form { grid-template-columns: 1fr 1fr; } }
  .field label { display: block; font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
  .field select, .field input { width: 100%; }
  .go-btn {
    all: unset; cursor: pointer; background: var(--accent); color: var(--accent-ink);
    border-radius: 8px; padding: 9px 14px; text-align: center; font-weight: 600; font-size: 14px;
  }
  .go-btn:hover { filter: brightness(1.06); }

  .result-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .result-empty { color: var(--text-3); font-size: 13.5px; padding: 6px 2px; }
  .result-grade-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .result-grade-row .grade-pill { font-size: 20px; padding: 6px 16px; border-radius: 10px; }
  .result-member { font-size: 14px; color: var(--text-2); }
  .result-quote {
    font-family: var(--mono); font-size: 13px; background: var(--surface-2);
    border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 0 6px 6px 0;
    margin: 8px 0; color: var(--text);
  }
  .result-source { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
  .no-match-hint { font-size: 13px; color: var(--text-2); margin-top: 4px; }

  .qual-list { margin-top: 4px; }
  .qual-list summary {
    cursor: pointer; font-size: 13px; color: var(--text-2); padding: 6px 0;
  }
  .qual-item { font-size: 13px; padding: 6px 0; border-top: 1px dashed var(--border); }
  .qual-item .g { font-family: var(--mono); font-weight: 700; margin-right: 6px; }

  /* ---- 본문 검색 ---- */
  .hit {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 15px; margin-bottom: 9px; box-shadow: var(--shadow);
  }
  .hit-path { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); margin-bottom: 6px; }
  .hit-text { font-size: 14px; }
  .hit-text mark { background: var(--warn-weak); color: var(--text); border-radius: 3px; padding: 0 2px; }
  .hit-ref {
    display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono);
    font-size: 12px; color: var(--accent); background: var(--accent-weak);
    border-radius: 6px; padding: 3px 8px; margin-top: 8px; cursor: pointer;
  }
  .hit-ref:hover { filter: brightness(1.05); }

  .empty-state { color: var(--text-3); font-size: 13.5px; padding: 30px 4px; text-align: center; }
  .count-line { font-size: 12.5px; color: var(--text-3); margin-bottom: 10px; font-family: var(--mono); }

  /* ---- 질문하기(채팅) ---- */
  .ask-unavailable {
    background: var(--warn-weak); color: var(--warn); border-radius: 10px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.6; margin-bottom: 16px;
  }
  .ask-unavailable b { color: var(--warn); }

  .chat-log { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .chat-log:empty { display: none; }
  .msg { display: flex; flex-direction: column; gap: 5px; max-width: 100%; }
  .msg .who {
    font-family: var(--mono); font-size: 11px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-3);
  }
  .msg .bubble {
    border-radius: 10px; padding: 12px 14px; font-size: 14.5px; line-height: 1.7;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.me .bubble { background: var(--accent-weak); color: var(--text); border: 1px solid var(--border); }
  .msg.ai .bubble { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .msg.ai .bubble.pending { color: var(--text-3); font-style: italic; }
  .msg .bubble b { font-weight: 600; }
  .msg .bubble code {
    font-family: var(--mono); font-size: 13px; background: var(--surface-2);
    border-radius: 4px; padding: 1px 5px;
  }

  .tool-trace { display: flex; flex-wrap: wrap; gap: 5px; }
  .tool-chip {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    background: var(--accent-weak); border-radius: 5px; padding: 2px 7px;
  }
  .tool-chip.err { color: var(--bad); background: var(--bad-weak); }

  .chat-input-row { display: flex; flex-direction: column; gap: 8px; }
  .chat-input-row textarea {
    width: 100%; font-family: var(--sans); font-size: 14.5px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 10px 12px; outline: none; resize: vertical;
    line-height: 1.6;
  }
  .chat-input-row textarea:focus { border-color: var(--accent); }
  .chat-input-row textarea::placeholder { color: var(--text-3); }
  .chat-buttons { display: flex; flex-direction: row; gap: 8px; }
  .chat-buttons .go-btn, .chat-buttons .stop-btn { flex: 1; }
  .chat-buttons .go-btn { padding: 10px 14px; }
  .stop-btn {
    all: unset; box-sizing: border-box; cursor: pointer; text-align: center;
    font-size: 13px; font-weight: 500; color: var(--bad); background: var(--bad-weak);
    border-radius: 8px; padding: 10px 14px;
  }
  .chat-hint { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  footer.foot {
    margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-3); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }

  /* ---- 답변 렌더링 ---- */
  /* 모델이 돌려주는 마크다운을 그대로 보여주면 |---|---| 가 글자로 보인다.
     표는 표로 그린다 - 연도별 비교는 표가 아니면 읽히지 않는다. */
  .ans-table-wrap { overflow-x: auto; margin: 11px 0; }
  .ans-table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .ans-table th, .ans-table td {
    border: 1px solid var(--border); padding: 7px 11px;
    text-align: left; vertical-align: top; line-height: 1.55;
  }
  .ans-table thead th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
  .ans-table tbody tr:nth-child(even) td { background: rgba(0,0,0,.018); }
  .ans-h { margin: 14px 0 6px; font-size: 14px; font-weight: 600; color: var(--text); }
  .ans-p { margin: 9px 0; line-height: 1.68; }
  .ans-ul { margin: 9px 0 9px 4px; padding-left: 18px; }
  .ans-ul li { margin: 4px 0; line-height: 1.62; }
  .ans-quote {
    margin: 10px 0; padding: 9px 13px; border-left: 3px solid var(--border-strong);
    background: var(--surface-2); border-radius: 0 7px 7px 0; line-height: 1.6;
  }
  .msg .bubble > :first-child { margin-top: 0; }
  .msg .bubble > :last-child { margin-bottom: 0; }

  /* 왼쪽은 질문 목록 + 질문 입력, 가운데는 선택된 질문의 결과 화면 하나만 보여준다. */
  .chat-shell {
    max-width: 1120px; margin: 0 auto; display: grid;
    grid-template-columns: 260px 1fr; gap: 22px; align-items: start;
  }
  @media (max-width: 760px) { .chat-shell { grid-template-columns: 1fr; } }

  .q-sidebar {
    display: flex; flex-direction: column; gap: 7px; position: sticky; top: 20px;
    max-height: calc(100vh - 40px); overflow-y: auto; padding-right: 2px;
  }
  .q-sidebar-title {
    font-size: 11px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: .06em; padding: 0 2px 2px;
  }
  .q-sidebar-title.ask {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .q-empty { font-size: 12.5px; color: var(--text-3); padding: 2px 2px 6px; }

  /* 질문 목록은 박스가 아니라 그냥 줄이다: "Q1. 질문..." 한 줄 + 밑에 상태 한 줄.
     텍스트는 줄바꿈 없이 한 줄로 자르고(...), 상태 줄도 높이를 늘 고정해
     항목 높이가 다 같게 유지한다. */
  .q-item { display: flex; align-items: center; gap: 2px; }
  .q-item-main {
    all: unset; box-sizing: border-box; cursor: pointer; flex: 1; min-width: 0;
    padding: 6px 4px 6px 8px; border-radius: 6px; border-left: 3px solid transparent;
  }
  .q-item:hover .q-item-main { background: var(--surface-2); }
  .q-item.active .q-item-main { border-left-color: var(--accent); }
  .q-item.active .q-text { color: var(--accent); font-weight: 600; }
  .q-item .q-text {
    font-size: 13px; color: var(--text); line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .q-item .q-status {
    font-size: 11px; color: var(--accent); margin-top: 3px;
    height: 13px; line-height: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .q-item.err .q-status { color: var(--bad); }
  .q-del {
    all: unset; box-sizing: border-box; cursor: pointer; flex-shrink: 0;
    width: 22px; height: 22px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; color: var(--text-3);
  }
  .q-del:hover { background: var(--surface-2); color: var(--bad); }

  .result-screen { display: none; }
  .result-screen.active { display: block; }

  /* ---- 답변 아래 출처: 인용한 표가 실제로 있는 PDF 쪽을 작은 그림으로 나열하고,
     누르면 크게 본다 ---- */
  .src-block { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .src-title {
    font-size: 11px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 10px;
  }
  /* 출처가 많아 가로 폭을 넘으면 줄바꿈하지 않고 옆으로 드래그해서 본다. */
  .src-list {
    display: flex; flex-wrap: nowrap; gap: 14px;
    overflow-x: auto; padding-bottom: 8px; cursor: grab;
    scrollbar-width: thin;
  }
  .src-list.dragging { cursor: grabbing; }
  .src-list.dragging .src-thumb { pointer-events: none; }
  .src-list::-webkit-scrollbar { height: 7px; }
  .src-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .src-list::-webkit-scrollbar-track { background: transparent; }
  .src-thumb {
    all: unset; box-sizing: border-box; cursor: zoom-in;
    flex: none; width: 512px;
  }
  .src-thumb .src-label {
    font-family: var(--mono); font-size: 12px; color: var(--text-2);
    margin-bottom: 6px; line-height: 1.4;
  }
  .src-thumb img {
    width: 100%; height: 672px; object-fit: cover; object-position: top center;
    display: block; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); transition: border-color .12s;
    -webkit-user-drag: none; user-select: none;
  }
  .src-thumb:hover img { border-color: var(--accent); }

  /* flex + align-items:center로 가운데 정렬하면, 내용이 넘칠 때 시작(위/왼쪽)
     쪽은 스크롤해도 안 보이는 브라우저 공통 문제가 있다 - grid + place-items로
     바꾸면 그 문제 없이 넘친 쪽도 스크롤로 다 볼 수 있다. */
  .src-modal {
    position: fixed; inset: 0; z-index: 1000; background: rgba(20,16,8,.65);
    display: grid; place-items: center; padding: 36px;
    cursor: zoom-out; overflow: auto;
  }
  .src-modal[hidden] { display: none; }
  .src-modal img {
    max-width: 100%; max-height: 100%; display: block; cursor: default;
    border-radius: 6px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .src-modal-label {
    position: fixed; z-index: 1; top: 18px; left: 50%; transform: translateX(-50%);

<script id="bridge-data" type="application/json">/*__BRIDGE_DATA__*/{}</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('bridge-data').textContent);
  var YEARS = DATA.연도목록.slice().sort();

  // "면"은 data/파생 쪽 데이터 자체가 이미 실제 PDF 물리 페이지로 고쳐져 있다
  // (build/17_페이지값_보정.py) - 표 번호를 다시 페이지로 찾을 필요 없이
  // 도구가 돌려준 값을 그대로 PDF 쪽 번호로 쓰면 된다.
  // 전체 PDF를 열지 않고 그 한 쪽만 잘라 그림으로 보여준다(서버가 그때그때 렌더링).
  function pdfPageImageUrl(year, physical){
    return '../data/출처페이지/' + year + '/' + physical + '.png';
  }

  // 아티팩트 뷰어 모드는 이 페이지의 JS가 도구를 직접 돌리므로(서버가 없다),
  // 표를 실제로 읽은 호출 결과에서 (연도,표번호,면)을 여기서 직접 뽑아 모은다.
  // 로컬 서버 모드는 같은 정보를 서버가 이미 뽑아 /ask 응답에 실어 보낸다.
  var TABLE_CONTENT_PAGE = /^면:\s*(\d+)/m;

  function collectSourcePairs(name, r, out){
    if (!r || !r.found || !r.year) return;
    if (name === 'grade_lookup' && r.source && r.source.page) {
      out.push({ year: r.year, table: r.source.table, page: r.source.page });
    } else if (name === 'qualitative_criteria' && Array.isArray(r.criteria)) {
      r.criteria.forEach(function(c){ if (c.page) out.push({ year: r.year, table: c.table, page: c.page }); });
    } else if (name === 'table_content') {
      // 연도 비교 질문("2024년과 2026년이 어떻게 다른가")은 이 도구로 표 전체를
      // 두 번 읽는다. 면은 필드가 아니라 마크다운 본문의 "면: N" 줄에만 있다.
      var m = TABLE_CONTENT_PAGE.exec(r.content || '');
      if (m) out.push({ year: r.year, table: r.number, page: Number(m[1]) });
    }
  }

  function esc(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function squash(s){ return (s||'').replace(/[\s:：·・]+/g,''); }

  var anchorEntries = Object.keys(DATA.표).map(function(k){
    var e = DATA.표[k]; e._key = k; return e;
  });


  // 번호 -> {연도: 제목} 역색인 (경고 배지용)
  var numberIndex = {};
  anchorEntries.forEach(function(entry){
    Object.keys(entry.연도별).forEach(function(y){
      var no = entry.연도별[y].번호;
      if (!no) return;
      numberIndex[no] = numberIndex[no] || {};
      numberIndex[no][y] = entry.제목;
    });
  });

  function numericRulesFor(year){
    return (DATA.판정규칙[year] || []).filter(function(r){ return r.연산 !== '정성' && r.지표; });
  }
  function allRulesFor(year){ return DATA.판정규칙[year] || []; }

  function satisfies(r, v){
    switch(r.연산){
      case '구간':
        var lo = r.최소포함 ? v >= r.최소 : v > r.최소;
        var hi = r.최대포함 ? v <= r.최대 : v < r.최대;
        return lo && hi;
      case '미만': return v < r.값;
      case '이하': return v <= r.값;
      case '초과': return v > r.값;
      case '이상': return v >= r.값;
    }
    return false;
  }

  // ---------------- 질문하기(채팅) ----------------
  // 원칙: 등급은 Claude가 아니라 이 페이지의 코드가 판정한다. Claude는 질문을
  // 해석해 아래 도구를 고르고, 도구가 돌려준 값을 근거와 함께 설명할 뿐이다.

  var RULES = [
    '당신은 「시설물의 안전 및 유지관리 실시 세부지침(안전점검·진단 편) 교량편」 질의응답 도우미입니다.',
    '2022 / 2023 / 2024 / 2026 네 개 판본을 다룹니다. 한국어로 답합니다.',
    '',
    '반드시 지킬 규칙:',
    '1. 등급을 스스로 계산하지 마세요. 수치 판정은 반드시 grade_lookup 도구를 호출하고, 도구가 돌려준 등급만 인용합니다. "0.25는 0.1~0.3 사이니까 b"처럼 직접 비교하는 것은 금지입니다.',
    '2. 모든 사실에 출처를 붙입니다: (연도판, 표번호, 면). 도구가 돌려준 출처를 그대로 씁니다.',
    '3. 표 번호는 판본마다 밀립니다. 표 번호로 답하기 전에 table_lookup으로 연도를 확인하고, 연도마다 다른 표를 가리키면 그 경고를 반드시 함께 전합니다.',
    '4. 질문에 연도가 없으면 2026년판을 기본으로 쓰되, 답변에 "2026년판 기준"이라고 명시합니다.',
    '5. 수치 없는 서술형(정성) 기준은 등급을 확정하지 마세요. 해당 기준 원문을 보여주고 최종 판단은 점검자 몫이라고 밝힙니다.',
    '6. 도구가 못 찾으면 모른다고 답합니다. 지침서에 없는 내용을 지어내지 마세요.',
    '7. 부재명·지표명이 애매하면 list_members로 실제 이름을 확인한 뒤 진행합니다.',
    '',
    '알려진 함정: "데크플레이트 부식"은 철근부식이 아니라 누수 및 백태 계열 항목입니다. 표면손상은 부재에 따라 표면손상 / 열화 및 손상 / 표면열화로 이름이 다릅니다.',
    '',
    '답변은 짧고 구체적으로. 등급이 나오면 첫 줄에 결론(등급), 다음 줄에 근거 원문, 마지막에 출처를 적습니다.'
  ].join('\n');

  function findMember(year, q){
    var rules = numericRulesFor(year);
    var members = Array.from(new Set(rules.map(function(r){ return r.부재; })));
    var t = squash(q);
    var exact = members.find(function(m){ return squash(m) === t; });
    if (exact) return exact;
    return members.find(function(m){ return squash(m).indexOf(t) !== -1 || t.indexOf(squash(m)) !== -1; }) || null;
  }
  function findIndicator(year, member, q){
    var rules = numericRulesFor(year).filter(function(r){ return r.부재 === member; });
    var inds = Array.from(new Set(rules.map(function(r){ return r.지표; })));
    var t = squash(q);
    var exact = inds.find(function(i){ return squash(i) === t; });
    if (exact) return exact;
    return inds.find(function(i){ return squash(i).indexOf(t) !== -1 || t.indexOf(squash(i)) !== -1; }) || null;
  }
  function yearOf(v){
    var y = String(v == null ? '' : v).trim();
    return YEARS.indexOf(y) !== -1 ? y : YEARS[YEARS.length - 1];
  }

  var TOOLS = [
    {
      name: 'list_members',
      description: '해당 연도판에서 수치 판정이 가능한 부재 목록과 각 부재의 지표 목록을 돌려준다. 사용자가 말한 부재·지표 이름이 실제 지침서 표기와 다를 때 정확한 이름을 찾기 위해 먼저 호출한다.',
      inputSchema: { type: 'object', properties: {
        year: { type: 'string', description: '연도. 2022/2023/2024/2026 중 하나. 생략하면 2026.' }
      } },
      execute: function(input){
        var year = yearOf(input.year);
        var rules = numericRulesFor(year);
        var byMember = {};
        rules.forEach(function(r){
          byMember[r.부재] = byMember[r.부재] || new Set();
          byMember[r.부재].add(r.지표);
        });
        return {
          year: year,
          members: Object.keys(byMember).sort().map(function(m){
            return { member: m, indicators: Array.from(byMember[m]).sort() };
          })
        };
      }
    },
    {
      name: 'grade_lookup',
      description: '부재·지표·실측값으로 등급을 판정한다. 페이지 안의 판정규칙표를 코드가 직접 대조해 등급·근거 원문·출처(표번호,면)를 돌려준다. 등급은 반드시 이 도구로만 구한다. 맞는 구간이 없으면 후보 조건들을 돌려준다.',
      inputSchema: { type: 'object', properties: {
        year: { type: 'string', description: '연도. 생략하면 2026.' },
        member: { type: 'string', description: '부재명. 예: 콘크리트 바닥판' },
        indicator: { type: 'string', description: '지표명. 예: 균열폭' },
        value: { type: 'number', description: '실측값(숫자). 예: 0.25' }
      }, required: ['member', 'indicator', 'value'] },
      execute: function(input){
        var year = yearOf(input.year);
        var v = Number(input.value);
        if (!isFinite(v)) throw new Error('value가 숫자가 아닙니다: ' + input.value);
        var member = findMember(year, String(input.member || ''));
        if (!member) return { found: false, reason: '그런 부재가 없습니다', hint: 'list_members로 실제 부재명을 확인하세요', year: year };
        var indicator = findIndicator(year, member, String(input.indicator || ''));
        if (!indicator) {
          var inds = Array.from(new Set(numericRulesFor(year).filter(function(r){ return r.부재 === member; }).map(function(r){ return r.지표; })));
          return { found: false, reason: '그 부재에 그런 지표가 없습니다', member: member, available_indicators: inds, year: year };
        }
        var cands = numericRulesFor(year).filter(function(r){ return r.부재 === member && r.지표 === indicator; });
        var hit = cands.find(function(r){ return satisfies(r, v); });
        if (hit) {
          return { found: true, year: year, member: member, indicator: indicator, value: v,
                   grade: hit.등급, quote: hit.원문, unit: hit.단위 || null,
                   source: { table: hit.표, page: hit.면 } };
        }
        return { found: false, reason: '이 값에 맞는 수치 구간이 없습니다', year: year,
                 member: member, indicator: indicator, value: v,
                 candidates: cands.map(function(r){ return { grade: r.등급, quote: r.원문, table: r.표, page: r.면 }; }) };
      }
    },
    {
      name: 'qualitative_criteria',
      description: '해당 부재의 서술형(정성) 상태평가기준 목록을 등급별로 돌려준다. 수치가 없는 손상(균열 형태, 부식 상태 등)을 물었을 때 근거 원문을 보여주기 위해 쓴다. 이 기준으로는 등급을 확정하지 말고 후보로만 제시한다.',
      inputSchema: { type: 'object', properties: {
        year: { type: 'string', description: '연도. 생략하면 2026.' },
        member: { type: 'string', description: '부재명' }
      }, required: ['member'] },
      execute: function(input){
        var year = yearOf(input.year);
        var member = findMember(year, String(input.member || ''));
        var all = allRulesFor(year);
        if (!member) {
          var names = Array.from(new Set(all.map(function(r){ return r.부재; })));
          var t = squash(String(input.member || ''));
          member = names.find(function(m){ return squash(m).indexOf(t) !== -1; }) || null;
        }
        if (!member) return { found: false, reason: '그런 부재가 없습니다', year: year };
        var quals = all.filter(function(r){ return r.연산 === '정성' && r.부재 === member; });
        return { found: quals.length > 0, year: year, member: member,
                 note: '정성 기준입니다. 등급을 확정하지 말고 후보로만 제시하세요.',
                 criteria: quals.slice(0, 40).map(function(r){
                   return { grade: r.등급, item: r.항목, text: String(r.원문).slice(0, 300), table: r.표, page: r.면 };
                 }) };
      }
    },
    {
      name: 'table_lookup',
      description: '표 번호나 제목으로 표를 찾는다. 연도별 표 번호를 나란히 돌려주고, 같은 번호가 연도마다 다른 표를 가리키면 경고를 함께 돌려준다. 표 내용 자체가 필요하면 이어서 table_content를 호출한다.',
      inputSchema: { type: 'object', properties: {
        query: { type: 'string', description: '표 번호("1.31") 또는 제목 일부("부재별 가중치")' }
      }, required: ['query'] },
      execute: function(input){
        var q = squash(String(input.query || ''));
        var qNum = q.replace(/\./g, '');
        var hits = anchorEntries.filter(function(e){
          if (squash(e.제목).indexOf(q) !== -1) return true;
          return Object.keys(e.연도별).some(function(y){
            var no = e.연도별[y].번호;
            return no && no.replace(/\./g, '') === qNum;
          });
        }).slice(0, 6);
        if (!hits.length) return { found: false, query: String(input.query || '') };
        return { found: true, results: hits.map(function(e){
          var byYear = {};
          Object.keys(e.연도별).sort().forEach(function(y){ byYear[y] = e.연도별[y].번호 ? ('표' + e.연도별[y].번호) : '무번호'; });
          var warn = null;
          Object.keys(e.연도별).forEach(function(y){
            var no = e.연도별[y].번호;
            if (!no) return;
            var others = numberIndex[no] || {};
            if (new Set(Object.values(others)).size > 1) {
              warn = '표' + no + '은 연도마다 다른 표를 가리킵니다: ' +
                Object.keys(others).sort().map(function(yy){ return yy + '=' + others[yy]; }).join(' / ');
            }
          });
          var out = { title: e.제목, numbers_by_year: byYear };
          if (warn) out.warning = warn;
          return out;
        }) };
      }
    },
    {
      name: 'table_content',
      description: '표 하나의 실제 내용(등급별 기준 원문)을 돌려준다. table_lookup으로 제목을 확인한 뒤 그 제목으로 호출한다. 길면 잘라서 돌려준다.',
      inputSchema: { type: 'object', properties: {
        title: { type: 'string', description: '표 제목(table_lookup이 돌려준 title을 그대로)' },
        year: { type: 'string', description: '연도. 생략하면 2026.' }
      }, required: ['title'] },
      execute: function(input){
        var year = yearOf(input.year);
        var t = squash(String(input.title || ''));
        var entry = anchorEntries.find(function(e){ return squash(e.제목) === t; }) ||
                    anchorEntries.find(function(e){ return squash(e.제목).indexOf(t) !== -1; });
        if (!entry) return { found: false, reason: '그 제목의 표가 없습니다' };
        var d = entry.연도별[year];
        if (!d) return { found: false, reason: year + '년판에는 이 표가 없습니다',
                         available_years: Object.keys(entry.연도별).sort() };
        return { found: true, year: year, title: entry.제목, number: d.번호,
                 content: String(d.내용).slice(0, 6000) };
      }
    },
    {
      name: 'body_search',
      description: '지침서 본문 문단을 검색해 일치하는 문단들을 절 이름과 함께 돌려준다. 절차·정의·적용범위 같은 서술형 질문("선택과업은 언제 하는가", "중대한 결함이란")에 쓴다.',
      inputSchema: { type: 'object', properties: {
        query: { type: 'string', description: '검색어' },
        year: { type: 'string', description: '연도. 생략하면 2026.' }
      }, required: ['query'] },
      execute: function(input){
        var year = yearOf(input.year);
        var q = String(input.query || '').trim();
        if (!q) throw new Error('query가 비었습니다');
        var out = [];
        (DATA.본문[year] || []).forEach(function(sec){
          sec.내용.split('\n').forEach(function(line){
            if (out.length >= 8) return;
            var content = null;
            if (line.indexOf('내용: ') === 0) content = line.slice(4);
            else if (/^#{2,5} /.test(line)) content = line.replace(/^#{2,5} /, '');
            if (content && content.indexOf(q) !== -1) {
              out.push({ section: sec.절, text: content.slice(0, 400) });
            }
          });
        });
        return { found: out.length > 0, year: year, query: q, hits: out };
      }
    }
  ];

  var chatLogEl = document.getElementById('chatLog');
  var chatBox = document.getElementById('chatBox');
  var chatSend = document.getElementById('chatSend');
  var chatStop = document.getElementById('chatStop');
  var chatHint = document.getElementById('chatHint');
  var askUnavailable = document.getElementById('askUnavailable');
  var qList = document.getElementById('qList');
  var qEmpty = document.getElementById('qEmpty');
  var mainEmpty = document.getElementById('mainEmpty');
  var questionCount = 0;

  // 질문마다 화면을 하나씩 만든다: 왼쪽 목록에는 "Qn. 질문"과 진행 상태만,
  // 가운데(chatLog)에는 지금 고른 질문의 결과 화면 하나만 보인다.
  function activateScreen(item, screen){
    document.querySelectorAll('.q-item.active').forEach(function(el){ el.classList.remove('active'); });
    document.querySelectorAll('.result-screen.active').forEach(function(el){ el.classList.remove('active'); });
    item.classList.add('active');
    screen.classList.add('active');
  }

  function newResultScreen(){
    mainEmpty.hidden = true;
    var screen = document.createElement('div');
    screen.className = 'result-screen';
    var msg = document.createElement('div');
    msg.className = 'msg ai';
    msg.innerHTML = '<div class="bubble"></div>';
    var trace = document.createElement('div');
    trace.className = 'tool-trace';
    screen.appendChild(msg);
    screen.appendChild(trace);
    chatLogEl.appendChild(screen);
    return { screen: screen, bubble: msg.querySelector('.bubble'), trace: trace };
  }

  // 답 아래 "출처": 실제로 표를 읽은 도구 호출에서 나온 (연도,표번호,면)들 중
  // 겹치는 페이지를 정리해, 참고한 PDF 쪽만 잘라 그림으로 전부 띄운다.
  function renderSources(screen, sources){
    if (!pdfBaseAvailable || !sources || !sources.length) return;
    var seen = {};
    var pages = [];
    sources.forEach(function(s){
      if (!s || !s.year || !s.page) return;
      var key = s.year + ':' + s.page;
      if (seen[key]) return;
      seen[key] = true;
      pages.push({ year: String(s.year), table: s.table, page: s.page });
    });
    if (!pages.length) return;

    var block = document.createElement('div');
    block.className = 'src-block';
    block.innerHTML = '<div class="src-title">출처</div>';
    var list = document.createElement('div');
    list.className = 'src-list';
    pages.forEach(function(p){
      var labelText = p.year + '년판' + (p.table ? (' · 표 ' + p.table) : '') + ' · ' + p.page + '쪽';
      var url = pdfPageImageUrl(p.year, p.page);

      var thumb = document.createElement('button');
      thumb.type = 'button';
      thumb.className = 'src-thumb';
      var label = document.createElement('div');
      label.className = 'src-label';
      label.textContent = labelText;
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = labelText;
      img.src = url;
      img.addEventListener('error', function(){ thumb.remove(); });
      thumb.addEventListener('click', function(){
        if (dragMoved) { dragMoved = false; return; }   // 드래그 끝의 클릭은 무시한다
        openSrcModal(url, labelText);
      });
      thumb.appendChild(label);
      thumb.appendChild(img);
      list.appendChild(thumb);
    });
    block.appendChild(list);
    screen.appendChild(block);
  }

  // 출처 그림을 눌렀을 때 크게 보여주는 창. 화면마다 새로 만들지 않고 하나를 공유한다.
  var srcModal = document.getElementById('srcModal');
  var srcModalImg = document.getElementById('srcModalImg');
  var srcModalLabel = document.getElementById('srcModalLabel');
  var srcModalClose = document.getElementById('srcModalClose');

  // Ctrl+휠로 확대/축소. transform:scale은 화면에 보이는 크기만 커질 뿐
  // 레이아웃 크기(스크롤 범위)는 그대로라 많이 확대하면 위쪽이 스크롤해도
  // 안 보였다 - 실제 가로/세로 픽셀 크기를 바꿔서 스크롤로 전부 닿게 한다.
  var srcZoom = 1;
  var srcBaseSize = null;   // 화면에 맞춘 기본 크기(줌 1배) - 그림이 뜬 뒤에 잰다
  var SRC_ZOOM_MIN = 0.5, SRC_ZOOM_MAX = 5, SRC_ZOOM_STEP = 0.12;

  function applySrcZoom(){
    if (!srcBaseSize) return;
    if (srcZoom === 1) {
      srcModalImg.style.width = '';
      srcModalImg.style.height = '';
    } else {
      srcModalImg.style.width = Math.round(srcBaseSize.w * srcZoom) + 'px';
      srcModalImg.style.height = Math.round(srcBaseSize.h * srcZoom) + 'px';
    }
  }

  function openSrcModal(url, labelText){
    srcZoom = 1;
    srcBaseSize = null;
    srcModalImg.style.width = '';
    srcModalImg.style.height = '';
    srcModalImg.alt = labelText;
    srcModalLabel.textContent = labelText;
    srcModal.hidden = false;
    srcModal.scrollTop = 0;
    srcModal.scrollLeft = 0;
    srcModalImg.onload = function(){
      // max-width/height:100%로 화면에 맞춰진 크기를 줌 1배의 기준으로 삼는다.
      srcBaseSize = { w: srcModalImg.clientWidth, h: srcModalImg.clientHeight };
      applySrcZoom();
    };
    srcModalImg.src = url;
  }
  function closeSrcModal(){
    srcModal.hidden = true;
    srcModalImg.src = '';
  }
  srcModal.addEventListener('click', function(e){ if (e.target === srcModal) closeSrcModal(); });
  srcModalClose.addEventListener('click', closeSrcModal);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !srcModal.hidden) closeSrcModal();
  });
  srcModal.addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    srcZoom += e.deltaY < 0 ? SRC_ZOOM_STEP : -SRC_ZOOM_STEP;
    srcZoom = Math.min(SRC_ZOOM_MAX, Math.max(SRC_ZOOM_MIN, srcZoom));
    applySrcZoom();
  }, { passive: false });

  // 출처 그림이 가로 폭을 넘치면 옆으로 드래그해서 본다(마우스로 붙잡고 끌기).
  // 드래그였는지 그냥 클릭이었는지는 움직인 거리로 구분해, 드래그 뒤에는
  // 확대창이 열리지 않게 한다.
  var dragList = null, dragStartX = 0, dragStartLeft = 0, dragMoved = false;

  document.addEventListener('mousedown', function(e){
    var list = e.target.closest && e.target.closest('.src-list');
    if (!list) return;
    dragList = list;
    dragStartX = e.pageX;
    dragStartLeft = list.scrollLeft;
    dragMoved = false;
    // 'dragging' 클래스는 여기서 바로 안 붙인다 - 그 클래스가 썸네일의
    // pointer-events를 꺼서, 누르자마자 붙이면 제자리 클릭까지 드래그로
    // 오인되어(마우스를 뗀 지점이 그림이 아니라 목록 배경으로 잡힌다) 확대창이
    // 안 열린다. 실제로 움직였다고 확인된 뒤에만 붙인다.
  });
  document.addEventListener('mousemove', function(e){
    if (!dragList) return;
    var dx = e.pageX - dragStartX;
    if (Math.abs(dx) > 10) {                     // 손떨림 정도의 움직임은 클릭으로 본다
      if (!dragMoved) dragList.classList.add('dragging');
      dragMoved = true;
    }
    if (dragMoved) dragList.scrollLeft = dragStartLeft - dx;
  });
  function endDrag(){
    if (dragList) dragList.classList.remove('dragging');
    dragList = null;
  }
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('mouseleave', endDrag);

  function activateLastOrEmpty(){
    var items = qList.querySelectorAll('.q-item');
    if (items.length) {
      var last = items[items.length - 1];
      activateScreen(last, last._screen);
    } else {
      mainEmpty.hidden = false;
    }
  }

  function addQuestionItem(question, screen){
    questionCount++;
    qEmpty.hidden = true;

    var item = document.createElement('div');
    item.className = 'q-item pending';
    item._screen = screen;
    item.innerHTML =
      '<button type="button" class="q-item-main">' +
        '<div class="q-text"></div>' +
        '<div class="q-status">질문에 대해서 생각중입니다...</div>' +
      '</button>' +
      '<button type="button" class="q-del" title="질문 삭제" aria-label="질문 삭제">×</button>';
    item.querySelector('.q-text').textContent = 'Q' + questionCount + '. ' + question;
    item.querySelector('.q-item-main').addEventListener('click', function(){ activateScreen(item, screen); });
    item.querySelector('.q-del').addEventListener('click', function(e){
      e.stopPropagation();
      removeQuestionItem(item, screen);
    });

    qList.appendChild(item);
    activateScreen(item, screen);
    return item;
  }

  function settleQuestionItem(item, ok){
    if (!item) return;
    item.classList.remove('pending');
    if (!ok) item.classList.add('err');
    var status = item.querySelector('.q-status');
    if (status) status.textContent = '';
  }

  // 실패/중지로 답이 전혀 없는 요청은 목록에 흔적을 남기지 않고 지운다.
  function dropQuestionItem(item, screen){
    if (screen) screen.remove();
    if (item) item.remove();
    questionCount--;
    if (!qList.children.length) qEmpty.hidden = false;
  }

  // 사용자가 직접 지우는 경우: 지금 보고 있던 질문이면 다른 질문으로 옮겨간다.
  function removeQuestionItem(item, screen){
    var wasActive = item.classList.contains('active');
    if (screen) screen.remove();
    item.remove();
    if (!qList.children.length) qEmpty.hidden = false;
    if (wasActive) activateLastOrEmpty();
  }
  var sampleFn = null;
  var toolsOk = false;
  var turns = [];
  var busy = false;
  var ctl = null;
  // PDF는 로컬 서버가 파일로 내줄 때만 열린다 - 서버 없이 열린 사본(파일/아티팩트)에는
  // 그 경로가 없다.
  var pdfBaseAvailable = false;

  // 모델은 마크다운으로 답한다. 그대로 두면 |---|---| 가 글자로 보인다.
  // 표는 표로, 목록은 목록으로 그린다 - 연도별 비교는 표가 아니면 안 읽힌다.
  // 답은 바깥에서 온 텍스트이므로 무엇을 그리든 먼저 이스케이프한다.
  function inlineMd(s){
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function isTableRow(s){ return /^\s*\|.*\|\s*$/.test(s); }
  function isTableSep(s){ return /^\s*\|[\s:\-|]+\|\s*$/.test(s) && s.indexOf('-') !== -1; }
  function tableCells(s){
    return s.trim().replace(/^\|/, '').replace(/\|$/, '').split('|')
            .map(function(c){ return c.trim(); });
  }
  var BULLET = /^\s*([-*+·◦∙・]|\d+[.)])\s+/;

  function fmt(text){
    var lines = String(text == null ? '' : text).split('\n');
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      // 표: 머리줄 + 구분줄이 이어질 때만 표로 본다
      if (isTableRow(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var head = tableCells(line);
        i += 2;
        var body = [];
        while (i < lines.length && isTableRow(lines[i])) { body.push(tableCells(lines[i])); i++; }
        out.push('<div class="ans-table-wrap"><table class="ans-table"><thead><tr>' +
          head.map(function(c){ return '<th>' + inlineMd(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          body.map(function(r){
            return '<tr>' + r.map(function(c){ return '<td>' + inlineMd(c) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>');
        continue;
      }

      // 제목
      var mh = line.match(/^\s*(#{1,4})\s+(.*)$/);
      if (mh) {
        out.push('<div class="ans-h">' + inlineMd(mh[2]) + '</div>');
        i++; continue;
      }

      // 인용 (원문 발췌에 쓰인다)
      if (/^\s*>\s?/.test(line)) {
        var quoted = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          quoted.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push('<div class="ans-quote">' + quoted.map(inlineMd).join('<br>') + '</div>');
        continue;
      }

      // 목록
      if (BULLET.test(line)) {
        var items = [];
        while (i < lines.length && BULLET.test(lines[i])) {
          items.push(lines[i].replace(BULLET, '')); i++;
        }
        out.push('<ul class="ans-ul">' +
          items.map(function(t){ return '<li>' + inlineMd(t) + '</li>'; }).join('') + '</ul>');
        continue;
      }

      if (!line.trim()) { i++; continue; }

      // 문단 - 이어지는 보통 줄을 묶는다
      var para = [];
      while (i < lines.length && lines[i].trim() && !isTableRow(lines[i]) &&
             !/^\s*(#{1,4})\s+/.test(lines[i]) && !/^\s*>\s?/.test(lines[i]) &&
             !BULLET.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      out.push('<div class="ans-p">' + para.map(inlineMd).join('<br>') + '</div>');
    }

    return out.join('') || '<div class="ans-p"></div>';
  }

  function errorCopy(code){
    switch (code) {
      case 'not_granted': return '이 페이지가 Claude를 쓰도록 허용되지 않았습니다. 왼쪽 탭에서 직접 조회해 주세요.';
      case 'rate_limited': return '요청이 너무 잦습니다. 잠시 후 다시 시도해 주세요.';
      case 'session_expired': return 'claude.ai에 다시 로그인한 뒤 시도해 주세요.';
      case 'refused': return '이 질문에는 답할 수 없습니다. 다르게 물어봐 주세요.';
      case 'empty_completion': return '답을 만들지 못했습니다. 질문을 더 구체적으로 적어 주세요.';
      case 'prompt_too_large': return '대화가 너무 길어졌습니다. 새 질문으로 다시 시작해 주세요.';
      case 'cancelled': return null;
      default: return '연결에 문제가 있었습니다. 잠시 후 다시 시도해 주세요.';
    }
  }

  function setBusy(on){
    busy = on;
    chatSend.disabled = on;
    chatSend.style.opacity = on ? '.5' : '';
    chatStop.hidden = !on;
  }

  async function ask(question){
    if (busy || !sampleFn) return;
    var q = String(question || '').trim();
    if (!q) return;
    chatBox.value = '';

    turns.push({ role: 'user', content: q });
    // 대화가 길어지면 오래된 것부터 버린다(지시문 턴은 매 호출마다 새로 앞에 붙인다).
    while (turns.length > 8) turns.shift();

    var rs = newResultScreen();
    var bubble = rs.bubble;
    var trace = rs.trace;
    bubble.classList.add('pending');
    bubble.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';

    var qItem = addQuestionItem(q, rs.screen);
    var usedSources = [];

    function note(label, bad){
      var chip = document.createElement('span');
      chip.className = 'tool-chip' + (bad ? ' err' : '');
      chip.textContent = label;
      trace.appendChild(chip);
    }

    var wrapped = TOOLS.map(function(t){
      return {
        name: t.name, description: t.description, inputSchema: t.inputSchema,
        execute: function(input, context){
          try {
            var r = t.execute(input || {}, context);
            collectSourcePairs(t.name, r, usedSources);
            note(t.name + (input && input.member ? ' · ' + input.member : ''));
            return r;
          } catch (e) {
            note(t.name + ' 실패', true);
            throw e;
          }
        }
      };
    });

    ctl = new AbortController();
    setBusy(true);
    var first = true;
    try {
      var res = await sampleFn([{ role: 'user', content: RULES }].concat(turns), {
        tools: wrapped,
        cache: false,
        signal: ctl.signal,
        onText: function(u){
          if (first) { bubble.classList.remove('pending'); first = false; }
          bubble.innerHTML = fmt(u.text);
        }
      });
      bubble.classList.remove('pending');
      bubble.innerHTML = fmt(res.text);
      turns.push({ role: 'assistant', content: res.text });
      if (res.truncated) note('답이 길어 잘렸습니다', true);
      settleQuestionItem(qItem, true);
      renderSources(rs.screen, (res.sources && res.sources.length) ? res.sources : usedSources);
    } catch (e) {
      var kept = e && e.text ? e.text : '';
      var copy = errorCopy(e && e.code);
      bubble.classList.remove('pending');
      if (kept) {
        bubble.innerHTML = fmt(kept);
        if (copy) note(copy, true);
        settleQuestionItem(qItem, false);
      } else if (copy) {
        bubble.classList.add('pending');
        bubble.textContent = copy;
        settleQuestionItem(qItem, false);
      } else {
        // 아무 내용도 없이 끝난 요청(중지 등)이면 목록에 흔적을 남기지 않는다.
        dropQuestionItem(qItem, rs.screen);
        activateLastOrEmpty();
      }
      // 실패한 턴은 대화에서 빼서 다음 질문이 깨끗하게 시작하도록 한다.
      if (turns.length && turns[turns.length - 1].role === 'user') turns.pop();
    } finally {
      setBusy(false);
      ctl = null;
    }
  }

  chatSend.addEventListener('click', function(){ ask(chatBox.value); });
  chatStop.addEventListener('click', function(){ if (ctl) ctl.abort(); });
  chatBox.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(chatBox.value); }
  });

  // 질문 기능이 꺼지는 이유는 셋인데 대응 방법이 서로 다르다. 한 문구로
  // 뭉뚱그리면 사용자는 무엇을 바꿔야 하는지 알 수 없다 - 원인별로 말해준다.
  var ASK_OFF = {
    복사본: '<b>이 사본에서는 질문 기능을 쓸 수 없습니다.</b> ' +
           '로컬 파일(file://)이나 GitHub Pages처럼 claude.ai 밖에 놓인 사본에는 ' +
           'Claude로 가는 통로가 없습니다. 아래 <b>표 조회 · 등급 판정 · 본문 검색</b>은 ' +
           '인터넷 없이도 그대로 쓸 수 있습니다.',
    최상위: '<b>이 탭에서는 질문 기능이 켜지지 않습니다 — 아티팩트를 주소로 직접 열었기 때문입니다.</b> ' +
           'Claude 앱이나 claude.ai의 <b>아티팩트 뷰어 안에서</b> 열면 켜집니다. ' +
           '(터미널에서 <code>/artifacts</code>, 웹에서는 claude.ai/code/artifacts 목록에서 여세요.) ' +
           '아래 <b>표 조회 · 등급 판정 · 본문 검색</b>은 여기서도 그대로 됩니다.',
    도구없음: '<b>이 화면에서는 도구 호출이 허용되지 않아 질문 기능을 껐습니다.</b> ' +
            '등급을 코드로 판정하지 못하면 Claude가 수치를 눈대중으로 비교하게 되는데, ' +
            '그건 이 도구가 막으려는 바로 그 일입니다. ' +
            '아래 <b>표 조회 · 등급 판정 · 본문 검색</b>을 쓰세요.'
  };

  function disableAsk(why){
    askUnavailable.innerHTML = ASK_OFF[why] || ASK_OFF.복사본;
    askUnavailable.hidden = false;
    chatBox.disabled = true;
    chatSend.disabled = true;
    chatSend.style.opacity = '.5';
    chatHint.textContent = '';
  }

  // 엔진을 구하는 길이 둘이다.
  //  1) 로컬 서버(서버.py) - 터미널과 **같은 엔진**(claude -p)을 쓴다. 도구는
  //     서버 쪽 bridgekb가 실행한다. 어디서 열든 켜진다.
  //  2) Artifact 뷰어 - 보는 사람의 Claude를 빌린다. 도구는 이 페이지의 JS가
  //     실행한다. claude.ai 뷰어 안에서만 켜진다.
  // 어느 쪽이든 도구 명세와 판정 규칙은 같으므로 답도 같아야 한다.

  async function localEngine(){
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return null;
    try {
      var probe = await fetch('_engine', { cache: 'no-store' });
      if (!probe.ok) return null;
      var info = await probe.json();
      if (!info || !info.ok) return null;
    } catch (e) { return null; }

    // sampleFn과 같은 모양으로 감싼다: (turns, opts) -> {text}
    return function(input, opts){
      // input[0]은 ask()가 붙인 RULES 턴이다. 서버가 같은 규칙을 시스템
      // 프롬프트로 넣으므로 여기서는 뺀다.
      var turns = input.slice(1);
      return fetch('ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ turns: turns }),
        signal: opts && opts.signal
      }).then(function(r){ return r.json(); }).then(function(d){
        if (d.error) throw { code: d.code || 'upstream_error', message: d.error };
        return { text: d.text, sources: d.sources || [] };
      }).catch(function(e){
        if (e && e.name === 'AbortError') throw { code: 'cancelled', message: '중지' };
        throw e;
      });
    };
  }

  (async function initAsk(){
    try {
      var local = await localEngine();
      if (local) {
        sampleFn = local;
        toolsOk = true;             // 도구는 서버 쪽에서 돈다
        pdfBaseAvailable = true;    // 이 서버가 원본 PDF도 같은 상대경로로 내준다
        return;
      }

      if (!window.claude || !window.claude.use) { disableAsk('복사본'); return; }
      var s = await window.claude.use('sample');
      // 아티팩트 자체 호스트에서 최상위로 열리면 window.claude는 있어도
      // use()가 null을 준다. 뷰어 안에서 열어야 한다.
      if (!s) { disableAsk('최상위'); return; }
      var lim = await s.limits().catch(function(){ return null; });
      toolsOk = !!(lim && lim.tools);
      if (!toolsOk) { disableAsk('도구없음'); return; }   // 도구 없이는 등급을 코드로 판정할 수 없다
      sampleFn = s;
    } catch (e) {
      disableAsk('복사본');
    }
  })();


  // ---------------- 시작할 때 ----------------
  // /bridge-guide 세굴  ->  ?q=세굴 로 열린다. 엔진이 붙는 대로 바로 물어본다.
  try {
    var qp = new URLSearchParams(location.search).get('q');
    if (qp) {
      chatBox.value = qp;
      var 시도 = 0;
      var 대기 = setInterval(function(){
        if (sampleFn) { clearInterval(대기); ask(qp); }
        else if (++시도 > 50) { clearInterval(대기); }   // 10초까지만 기다린다
      }, 200);
    }
  } catch (e) { /* URLSearchParams가 막히면 그냥 빈 화면으로 연다 */ }
})();
</script>
