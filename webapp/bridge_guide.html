<meta charset="utf-8">
<title>교량 지침서 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f3f4f6;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #1c1c1e;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --accent: #2f6690;
    --accent-ink: #ffffff;
    --accent-weak: #eaf1f7;
    --good: #2f8a4e;
    --good-weak: #e6f4ea;
    --warn: #96660c;
    --warn-weak: #f5eedc;
    --bad: #b3413f;
    --bad-weak: #fbe9e8;
    --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --sans: 'IBM Plex Sans KR', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    /* 움직임은 도구가 굼떠 보이지 않을 만큼만 준다 - 색은 120ms, 등장은 180ms. */
    --ease: cubic-bezier(.2,.7,.3,1);
    --dur-1: 120ms;
    --dur-2: 180ms;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f;
      --surface: #201b13;
      --surface-2: #291f19;
      --border: #3c3122;
      --border-strong: #55452c;
      --text: #ece3cf;
      --text-2: #ab9d80;
      --text-3: #8a7d63;
      --accent: #7fb2da;
      --accent-ink: #0f2333;
      --accent-weak: #22374a;
      --good: #72bd83;
      --good-weak: #1f3324;
      --warn: #dcac52;
      --warn-weak: #3a2e13;
      --bad: #e08a8a;
      --bad-weak: #3a2222;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f;
    --surface: #201b13;
    --surface-2: #291f19;
    --border: #3c3122;
    --border-strong: #55452c;
    --text: #ece3cf;
    --text-2: #ab9d80;
    --text-3: #8a7d63;
    --accent: #7fb2da;
    --accent-ink: #0f2333;
    --accent-weak: #22374a;
    --good: #72bd83;
    --good-weak: #1f3324;
    --warn: #dcac52;
    --warn-weak: #3a2e13;
    --bad: #e08a8a;
    --bad-weak: #3a2222;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  /* all: unset 을 쓰는 버튼(.stop-btn 등)은 브라우저가 [hidden] 에 주는 display: none
     까지 지워버려서, 코드가 hidden 을 걸어도 계속 보였다. 여기서 되돌린다. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-weak); }

  .app { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---- header ---- */
  header.top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 {
    font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em;
    text-wrap: balance;
  }
  .brand .tag {
    font-family: var(--mono); font-size: 12px; color: var(--text-3);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px;
  }
  .sub { color: var(--text-2); font-size: 13.5px; margin-top: 4px; max-width: 62ch; }

  .years { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .years .label { font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
  .year-chip {
    font-family: var(--mono); font-size: 13px; font-weight: 500;
    border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text-2); border-radius: 999px; padding: 5px 12px; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .year-chip:hover { border-color: var(--accent); }
  .year-chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* ---- layout ---- */
  main { min-width: 0; }

  /* ---- 질문하기(채팅) ---- */
  .ask-unavailable {
    background: var(--warn-weak); color: var(--warn); border-radius: 10px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.6; margin-bottom: 16px;
  }
  .ask-unavailable b { color: var(--warn); }

  .chat-log { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .chat-log:empty { display: none; }
  .msg { display: flex; flex-direction: column; gap: 5px; max-width: 100%; }
  .msg .who {
    font-family: var(--mono); font-size: 11px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-3);
  }
  .msg .bubble {
    border-radius: 10px; padding: 12px 14px; font-size: 14.5px; line-height: 1.7;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.me .bubble { background: var(--accent-weak); color: var(--text); border: 1px solid var(--border); }
  .msg.ai .bubble { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .msg.ai .bubble.pending { color: var(--text-3); font-style: italic; }
  /* 답이 도착하면 코드가 pending 클래스를 뗀다. 그 순간 이 선택자가 처음 맞아떨어져
     애니메이션이 재생된다 - 답을 넣는 코드는 손대지 않고도 등장이 붙는다. */
  .msg.ai .bubble:not(.pending) { animation: bubble-in var(--dur-2) var(--ease) both; }
  @keyframes bubble-in { from { opacity: 0; transform: translateY(6px); } }
  .msg .bubble b { font-weight: 600; }
  .msg .bubble code {
    font-family: var(--mono); font-size: 13px; background: var(--surface-2);
    border-radius: 4px; padding: 1px 5px;
  }

  .tool-trace { display: flex; flex-wrap: wrap; gap: 5px; }
  .tool-chip {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    background: var(--accent-weak); border-radius: 5px; padding: 2px 7px;
  }
  .tool-chip.err { color: var(--bad); background: var(--bad-weak); }

  .chat-input-row { display: flex; flex-direction: column; gap: 8px; }
  .chat-input-row textarea {
    width: 100%; font-family: var(--sans); font-size: 14.5px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 10px 12px; outline: none; resize: vertical;
    line-height: 1.6;
    transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
  }
  .chat-input-row textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak);
  }
  .chat-input-row textarea::placeholder { color: var(--text-3); }
  .chat-buttons { display: flex; flex-direction: row; gap: 8px; }
  .chat-buttons .go-btn, .chat-buttons .stop-btn { flex: 1; }
  /* all: unset 이 앞줄의 flex 까지 지우므로 여기서 다시 준다. */
  .chat-buttons .go-btn {
    all: unset; box-sizing: border-box; cursor: pointer; text-align: center;
    font-size: 13px; font-weight: 600; color: var(--accent-ink); background: var(--accent);
    border-radius: 8px; padding: 10px 14px; flex: 1;
    transition: filter var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
  }
  .chat-buttons .go-btn:not(:disabled):hover { filter: brightness(1.08); }
  .chat-buttons .go-btn:not(:disabled):active { transform: scale(.98); }
  .chat-buttons .go-btn:disabled { cursor: default; }
  .stop-btn {
    all: unset; box-sizing: border-box; cursor: pointer; text-align: center;
    font-size: 13px; font-weight: 500; color: var(--bad); background: var(--bad-weak);
    border-radius: 8px; padding: 10px 14px;
    transition: filter var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
  }
  .stop-btn:hover { filter: brightness(1.06); }
  .stop-btn:active { transform: scale(.98); }
  .chat-hint { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  footer.foot {
    margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-3); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }

  /* ---- 답변 렌더링 ---- */
  /* 모델이 돌려주는 마크다운을 그대로 보여주면 |---|---| 가 글자로 보인다.
     표는 표로 그린다 - 연도별 비교는 표가 아니면 읽히지 않는다. */
  .ans-table-wrap { overflow-x: auto; margin: 11px 0; }
  .ans-table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .ans-table th, .ans-table td {
    border: 1px solid var(--border); padding: 7px 11px;
    text-align: left; vertical-align: top; line-height: 1.55;
  }
  .ans-table thead th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
  .ans-table tbody tr:nth-child(even) td { background: rgba(0,0,0,.018); }
  .ans-h { margin: 14px 0 6px; font-size: 14px; font-weight: 600; color: var(--text); }
  .ans-p { margin: 9px 0; line-height: 1.68; }
  .ans-ul { margin: 9px 0 9px 4px; padding-left: 18px; }
  .ans-ul li { margin: 4px 0; line-height: 1.62; }
  .ans-quote {
    margin: 10px 0; padding: 9px 13px; border-left: 3px solid var(--border-strong);
    background: var(--surface-2); border-radius: 0 7px 7px 0; line-height: 1.6;
  }
  .msg .bubble > :first-child { margin-top: 0; }
  .msg .bubble > :last-child { margin-bottom: 0; }

  /* 왼쪽은 질문 목록 + 질문 입력, 가운데는 선택된 질문의 결과 화면 하나만 보여준다. */
  .chat-shell {
    max-width: 1120px; margin: 0 auto; display: grid;
    grid-template-columns: 260px 1fr; gap: 22px; align-items: start;
  }
  @media (max-width: 760px) { .chat-shell { grid-template-columns: 1fr; } }

  .q-sidebar {
    display: flex; flex-direction: column; gap: 7px; position: sticky; top: 20px;
    max-height: calc(100vh - 40px); overflow-y: auto; padding-right: 2px;
  }
  .q-sidebar-title {
    font-size: 11px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: .06em; padding: 0 2px 2px;
  }
  .q-sidebar-title.ask {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .q-empty { font-size: 12.5px; color: var(--text-3); padding: 2px 2px 6px; }

  /* 질문 목록은 박스가 아니라 그냥 줄이다: "Q1. 질문..." 한 줄 + 밑에 상태 한 줄.
     텍스트는 줄바꿈 없이 한 줄로 자르고(...), 상태 줄도 높이를 늘 고정해
     항목 높이가 다 같게 유지한다. */
  .q-item { display: flex; align-items: center; gap: 2px; }
  .q-item-main {
    all: unset; box-sizing: border-box; cursor: pointer; flex: 1; min-width: 0;
    padding: 6px 4px 6px 8px; border-radius: 6px; border-left: 3px solid transparent;
    transition: background var(--dur-1) var(--ease), border-left-color var(--dur-1) var(--ease);
  }
  .q-item:hover .q-item-main { background: var(--surface-2); }
  .q-item.active .q-item-main { border-left-color: var(--accent); }
  .q-item.active .q-text { color: var(--accent); font-weight: 600; }
  .q-item .q-text {
    font-size: 13px; color: var(--text); line-height: 1.4;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color var(--dur-1) var(--ease);
  }
  .q-item .q-status {
    font-size: 11px; color: var(--accent); margin-top: 3px;
    height: 13px; line-height: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .q-item.err .q-status { color: var(--bad); }
  .q-del {
    all: unset; box-sizing: border-box; cursor: pointer; flex-shrink: 0;
    width: 22px; height: 22px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; color: var(--text-3);
    transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
  }
  .q-del:hover { background: var(--surface-2); color: var(--bad); }

  /* 들어오는 화면만 페이드한다. 나가는 화면까지 페이드하면 둘이 잠깐 같이 자리를
     차지해 목록 높이가 출렁인다 - 어차피 안 보이는 쪽이라 즉시 지우는 게 낫다.
     transform 없이 opacity 만 쓰는 것도 의도다(안쪽 요소의 기준 상자를 안 바꾼다). */
  .result-screen { display: none; }
  .result-screen.active { display: block; animation: screen-in var(--dur-2) var(--ease) both; }
  @keyframes screen-in { from { opacity: 0; } }

  /* ---- 답변 아래 출처: 인용한 표가 실제로 있는 PDF 쪽을 작은 그림으로 나열하고,
     누르면 크게 본다 ---- */
  .src-block { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .src-note { font-size: 13px; color: var(--text-2); line-height: 1.7; }
  .src-note-why { margin-top: 8px; font-size: 12.5px; color: var(--text-3); }
  .src-note-why code { font-family: var(--mono); font-size: 12px; }
  .src-title {
    font-size: 11px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 10px;
  }
  /* 출처가 많아 가로 폭을 넘으면 줄바꿈하지 않고 옆으로 드래그해서 본다. */
  .src-list {
    display: flex; flex-wrap: nowrap; gap: 14px;
    overflow-x: auto; padding: 3px 0 8px; cursor: grab;
    scrollbar-width: thin;
  }
  .src-list.dragging { cursor: grabbing; }
  .src-list.dragging .src-thumb { pointer-events: none; }
  .src-list::-webkit-scrollbar { height: 7px; }
  .src-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .src-list::-webkit-scrollbar-track { background: transparent; }
  .src-thumb {
    all: unset; box-sizing: border-box; cursor: zoom-in;
    flex: none; width: 512px;
  }
  .src-thumb .src-label {
    font-family: var(--mono); font-size: 12px; color: var(--text-2);
    margin-bottom: 6px; line-height: 1.4;
  }
  .src-thumb img {
    width: 100%; height: 672px; object-fit: cover; object-position: top center;
    display: block; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2);
    transition: border-color var(--dur-1) var(--ease),
                transform var(--dur-1) var(--ease),
                box-shadow var(--dur-1) var(--ease);
    -webkit-user-drag: none; user-select: none;
  }
  /* 2px 떠오르는 만큼 .src-list 위쪽에 여백을 줘 뒀다 - 안 그러면 잘린다. */
  .src-thumb:hover img {
    border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow);
  }

  /* flex + align-items:center로 가운데 정렬하면, 내용이 넘칠 때 시작(위/왼쪽)
     쪽은 스크롤해도 안 보이는 브라우저 공통 문제가 있다 - grid + place-items로
     바꾸면 그 문제 없이 넘친 쪽도 스크롤로 다 볼 수 있다. */
  .src-modal {
    position: fixed; inset: 0; z-index: 1000; background: rgba(20,16,8,.65);
    display: grid; place-items: center; padding: 36px;
    cursor: zoom-out; overflow: auto;
  }
  .src-modal[hidden] { display: none; }
  /* 열 때만 움직인다. 닫을 때는 코드가 img 의 src 를 바로 비우기 때문에,
     닫힘 애니메이션을 넣으면 빈 상자가 사라지는 그림이 된다.
     썸네일과 같은 주소를 쓰므로 이미지는 이미 캐시에 있다 - 빈 채로 뜨지 않는다. */
  .src-modal:not([hidden]) { animation: modal-in 160ms var(--ease) both; }
  .src-modal:not([hidden]) img { animation: modal-img-in 160ms var(--ease) both; }
  @keyframes modal-in { from { opacity: 0; } }
  @keyframes modal-img-in { from { opacity: 0; transform: scale(.97); } }
  .src-modal img {
    max-width: 100%; max-height: 100%; display: block; cursor: default;
    border-radius: 6px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .src-modal-label {
    position: fixed; z-index: 1; top: 18px; left: 50%; transform: translateX(-50%);
    color: #fff; font-family: var(--mono); font-size: 12.5px;
    background: rgba(0,0,0,.5); padding: 6px 14px; border-radius: 999px;
  }
  .src-modal-close {
    all: unset; box-sizing: border-box; position: fixed; z-index: 1; top: 14px; right: 14px;
    cursor: pointer; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; line-height: 1; background: rgba(255,255,255,.15);
    transition: background var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
  }
  .src-modal-close:hover { background: rgba(255,255,255,.28); }
  .src-modal-close:active { transform: scale(.94); }

  /* 기다리는 동안 점 세 개 대신, 곧 올 답의 모양(문단 - 표 - 문단)을 미리 그린다.
     뒤에 표가 온다는 걸 미리 알려주는 쪽이 기다리는 느낌을 줄인다. */
  .skeleton { display: flex; flex-direction: column; gap: 9px; }
  .skeleton span {
    display: block; border-radius: 5px;
    background: linear-gradient(90deg, var(--surface-2) 0%, var(--border) 50%, var(--surface-2) 100%);
    background-size: 200% 100%;
    animation: sk-shimmer 1.4s ease-in-out infinite;
  }
  .sk-line { height: 11px; }
  .sk-line.short { width: 55%; }
  .sk-table { height: 108px; border-radius: 7px; }
  @keyframes sk-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* 운영체제에서 "동작 줄이기"를 켠 사람에게는 위의 움직임을 전부 끈다.
     꺼도 스켈레톤 모양과 상태 글자는 그대로 보이므로 알려주는 내용은 그대로다. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>


<div class="app">
  <header class="top">
    <div>
      <div class="brand">
        <h1>교량 지침서 가이드</h1>
        <span class="tag">bridge-guide</span>
      </div>
    </div>
  </header>

    <div class="chat-shell" id="chatShell">
    <aside class="q-sidebar" id="qSidebar">
      <div class="q-sidebar-title">질문 목록</div>
      <div class="q-empty" id="qEmpty">아직 질문이 없습니다.</div>
      <div id="qList"></div>

      <div class="q-sidebar-title ask">질문</div>
      <div id="askUnavailable" class="ask-unavailable" hidden></div>
      <div class="chat-input-row">
        <textarea id="chatBox" rows="4" placeholder="질문을 입력하세요."></textarea>
        <div class="chat-buttons">
          <button class="go-btn" id="chatSend">보내기</button>
          <button class="stop-btn" id="chatStop" hidden>중지</button>
        </div>
      </div>
      <div class="chat-hint" id="chatHint">Enter로 보내고, Shift+Enter로 줄바꿈합니다.</div>
    </aside>
    <main>
        <div class="empty-state" id="mainEmpty">왼쪽에서 질문을 입력하면 결과가 여기에 표시됩니다.</div>
        <div id="chatLog" class="chat-log"></div>
    </main>
  </div>

  <footer class="foot">
    <span>데이터: 2022 · 2023 · 2024 · 2026년판 「안전점검·진단 편」 교량편 (표 · 본문 · 판정규칙)</span>
    <span>등급은 코드가 판정규칙표를 대조해 계산합니다. 서술형(정성) 기준은 참고용이며 최종 판단은 점검자의 몫입니다.</span>
  </footer>
</div>

<div class="src-modal" id="srcModal" hidden>
  <div class="src-modal-label" id="srcModalLabel"></div>
  <button type="button" class="src-modal-close" id="srcModalClose" aria-label="닫기">×</button>
  <img id="srcModalImg" alt="">
</div>

<script>
(function(){
  "use strict";
  // 이 페이지는 도구를 직접 돌리지 않는다. 질문은 서버로 보내고, 도구는
  // 서버 쪽 bridgekb 하나가 실행한다. 예전에는 같은 도구가 여기 JS로도
  // 복사돼 있어서, 정렬 방식이 어긋나는 것만으로 터미널과 웹이 서로 다른
  // 표를 돌려줬다. 사본을 없애 그 종류의 어긋남을 구조적으로 막는다.

  // 답에 인용된 표가 실제로 있는 PDF 쪽. 서버가 그때그때 잘라 그려 준다.
  function pdfPageImageUrl(year, physical){
    return 'data/출처페이지/' + year + '/' + physical + '.png';
  }

  function esc(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var chatLogEl = document.getElementById('chatLog');
  var chatBox = document.getElementById('chatBox');
  var chatSend = document.getElementById('chatSend');
  var chatStop = document.getElementById('chatStop');
  var chatHint = document.getElementById('chatHint');
  var askUnavailable = document.getElementById('askUnavailable');
  var qList = document.getElementById('qList');
  var qEmpty = document.getElementById('qEmpty');
  var mainEmpty = document.getElementById('mainEmpty');
  var questionCount = 0;

  // 질문마다 화면을 하나씩 만든다: 왼쪽 목록에는 "Qn. 질문"과 진행 상태만,
  // 가운데(chatLog)에는 지금 고른 질문의 결과 화면 하나만 보인다.
  function activateScreen(item, screen){
    document.querySelectorAll('.q-item.active').forEach(function(el){ el.classList.remove('active'); });
    document.querySelectorAll('.result-screen.active').forEach(function(el){ el.classList.remove('active'); });
    item.classList.add('active');
    screen.classList.add('active');
  }

  function newResultScreen(){
    mainEmpty.hidden = true;
    var screen = document.createElement('div');
    screen.className = 'result-screen';
    var msg = document.createElement('div');
    msg.className = 'msg ai';
    msg.innerHTML = '<div class="bubble"></div>';
    var trace = document.createElement('div');
    trace.className = 'tool-trace';
    screen.appendChild(msg);
    screen.appendChild(trace);
    chatLogEl.appendChild(screen);
    return { screen: screen, bubble: msg.querySelector('.bubble'), trace: trace };
  }

  // 답 아래 "출처": 실제로 표를 읽은 도구 호출에서 나온 (연도,표번호,면)들 중
  // 겹치는 페이지를 정리해, 참고한 PDF 쪽만 잘라 그림으로 전부 띄운다.
  function renderSources(screen, sources){
    if (!sources || !sources.length) return;
    var seen = {};
    var pages = [];
    sources.forEach(function(s){
      if (!s || !s.year || !s.page) return;
      var key = s.year + ':' + s.page;
      if (seen[key]) return;
      seen[key] = true;
      pages.push({ year: String(s.year), table: s.table, page: s.page });
    });
    if (!pages.length) return;

    var block = document.createElement('div');
    block.className = 'src-block';
    block.innerHTML = '<div class="src-title">출처</div>';

    if (!pdfImages) {
      // 그림은 못 그려도 어느 쪽을 근거로 삼았는지는 알려줘야 한다.
      var note = document.createElement('div');
      note.className = 'src-note';
      note.innerHTML = pages.map(function(p){
        return esc(p.year + '년판' + (p.table ? (' · 표 ' + p.table) : '') + ' · ' + p.page + '쪽');
      }).join('<br>') +
        '<div class="src-note-why">원본 쪽 그림을 띄우려면 서버에서 ' +
        '<code>pip install pdfplumber</code> 후 다시 켜세요.</div>';
      block.appendChild(note);
      screen.appendChild(block);
      return;
    }
    var list = document.createElement('div');
    list.className = 'src-list';
    pages.forEach(function(p){
      var labelText = p.year + '년판' + (p.table ? (' · 표 ' + p.table) : '') + ' · ' + p.page + '쪽';
      var url = pdfPageImageUrl(p.year, p.page);

      var thumb = document.createElement('button');
      thumb.type = 'button';
      thumb.className = 'src-thumb';
      var label = document.createElement('div');
      label.className = 'src-label';
      label.textContent = labelText;
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = labelText;
      img.src = url;
      img.addEventListener('error', function(){ thumb.remove(); });
      thumb.addEventListener('click', function(){
        if (dragMoved) { dragMoved = false; return; }   // 드래그 끝의 클릭은 무시한다
        openSrcModal(url, labelText);
      });
      thumb.appendChild(label);
      thumb.appendChild(img);
      list.appendChild(thumb);
    });
    block.appendChild(list);
    screen.appendChild(block);
  }

  // 출처 그림을 눌렀을 때 크게 보여주는 창. 화면마다 새로 만들지 않고 하나를 공유한다.
  var srcModal = document.getElementById('srcModal');
  var srcModalImg = document.getElementById('srcModalImg');
  var srcModalLabel = document.getElementById('srcModalLabel');
  var srcModalClose = document.getElementById('srcModalClose');

  // Ctrl+휠로 확대/축소. transform:scale은 화면에 보이는 크기만 커질 뿐
  // 레이아웃 크기(스크롤 범위)는 그대로라 많이 확대하면 위쪽이 스크롤해도
  // 안 보였다 - 실제 가로/세로 픽셀 크기를 바꿔서 스크롤로 전부 닿게 한다.
  var srcZoom = 1;
  var srcBaseSize = null;   // 화면에 맞춘 기본 크기(줌 1배) - 그림이 뜬 뒤에 잰다
  var SRC_ZOOM_MIN = 0.5, SRC_ZOOM_MAX = 5, SRC_ZOOM_STEP = 0.12;

  function applySrcZoom(){
    if (!srcBaseSize) return;
    if (srcZoom === 1) {
      srcModalImg.style.width = '';
      srcModalImg.style.height = '';
    } else {
      srcModalImg.style.width = Math.round(srcBaseSize.w * srcZoom) + 'px';
      srcModalImg.style.height = Math.round(srcBaseSize.h * srcZoom) + 'px';
    }
  }

  function openSrcModal(url, labelText){
    srcZoom = 1;
    srcBaseSize = null;
    srcModalImg.style.width = '';
    srcModalImg.style.height = '';
    srcModalImg.alt = labelText;
    srcModalLabel.textContent = labelText;
    srcModal.hidden = false;
    srcModal.scrollTop = 0;
    srcModal.scrollLeft = 0;
    srcModalImg.onload = function(){
      // max-width/height:100%로 화면에 맞춰진 크기를 줌 1배의 기준으로 삼는다.
      srcBaseSize = { w: srcModalImg.clientWidth, h: srcModalImg.clientHeight };
      applySrcZoom();
    };
    srcModalImg.src = url;
  }
  function closeSrcModal(){
    srcModal.hidden = true;
    srcModalImg.src = '';
  }
  srcModal.addEventListener('click', function(e){ if (e.target === srcModal) closeSrcModal(); });
  srcModalClose.addEventListener('click', closeSrcModal);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !srcModal.hidden) closeSrcModal();
  });
  srcModal.addEventListener('wheel', function(e){
    if (!e.ctrlKey) return;
    e.preventDefault();
    srcZoom += e.deltaY < 0 ? SRC_ZOOM_STEP : -SRC_ZOOM_STEP;
    srcZoom = Math.min(SRC_ZOOM_MAX, Math.max(SRC_ZOOM_MIN, srcZoom));
    applySrcZoom();
  }, { passive: false });

  // 출처 그림이 가로 폭을 넘치면 옆으로 드래그해서 본다(마우스로 붙잡고 끌기).
  // 드래그였는지 그냥 클릭이었는지는 움직인 거리로 구분해, 드래그 뒤에는
  // 확대창이 열리지 않게 한다.
  var dragList = null, dragStartX = 0, dragStartLeft = 0, dragMoved = false;

  document.addEventListener('mousedown', function(e){
    var list = e.target.closest && e.target.closest('.src-list');
    if (!list) return;
    dragList = list;
    dragStartX = e.pageX;
    dragStartLeft = list.scrollLeft;
    dragMoved = false;
    // 'dragging' 클래스는 여기서 바로 안 붙인다 - 그 클래스가 썸네일의
    // pointer-events를 꺼서, 누르자마자 붙이면 제자리 클릭까지 드래그로
    // 오인되어(마우스를 뗀 지점이 그림이 아니라 목록 배경으로 잡힌다) 확대창이
    // 안 열린다. 실제로 움직였다고 확인된 뒤에만 붙인다.
  });
  document.addEventListener('mousemove', function(e){
    if (!dragList) return;
    var dx = e.pageX - dragStartX;
    if (Math.abs(dx) > 10) {                     // 손떨림 정도의 움직임은 클릭으로 본다
      if (!dragMoved) dragList.classList.add('dragging');
      dragMoved = true;
    }
    if (dragMoved) dragList.scrollLeft = dragStartLeft - dx;
  });
  function endDrag(){
    if (dragList) dragList.classList.remove('dragging');
    dragList = null;
  }
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('mouseleave', endDrag);

  function activateLastOrEmpty(){
    var items = qList.querySelectorAll('.q-item');
    if (items.length) {
      var last = items[items.length - 1];
      activateScreen(last, last._screen);
    } else {
      mainEmpty.hidden = false;
    }
  }

  function addQuestionItem(question, screen){
    questionCount++;
    qEmpty.hidden = true;

    var item = document.createElement('div');
    item.className = 'q-item pending';
    item._screen = screen;
    item.innerHTML =
      '<button type="button" class="q-item-main">' +
        '<div class="q-text"></div>' +
        '<div class="q-status">질문에 대해서 생각중입니다...</div>' +
      '</button>' +
      '<button type="button" class="q-del" title="질문 삭제" aria-label="질문 삭제">×</button>';
    item.querySelector('.q-text').textContent = 'Q' + questionCount + '. ' + question;
    item.querySelector('.q-item-main').addEventListener('click', function(){ activateScreen(item, screen); });
    item.querySelector('.q-del').addEventListener('click', function(e){
      e.stopPropagation();
      removeQuestionItem(item, screen);
    });

    qList.appendChild(item);
    activateScreen(item, screen);
    return item;
  }

  function settleQuestionItem(item, ok){
    if (!item) return;
    item.classList.remove('pending');
    if (!ok) item.classList.add('err');
    var status = item.querySelector('.q-status');
    if (status) status.textContent = '';
  }

  // 실패/중지로 답이 전혀 없는 요청은 목록에 흔적을 남기지 않고 지운다.
  function dropQuestionItem(item, screen){
    if (screen) screen.remove();
    if (item) item.remove();
    questionCount--;
    if (!qList.children.length) qEmpty.hidden = false;
  }

  // 사용자가 직접 지우는 경우: 지금 보고 있던 질문이면 다른 질문으로 옮겨간다.
  function removeQuestionItem(item, screen){
    var wasActive = item.classList.contains('active');
    if (screen) screen.remove();
    item.remove();
    if (!qList.children.length) qEmpty.hidden = false;
    if (wasActive) activateLastOrEmpty();
  }
  var serverReady = false;
  // 출처 그림은 서버에 pdfplumber 가 있어야 만들어진다. 없으면 그림 자리에
  // 이유를 적는다 - 예전에는 깨진 그림만 남아서 원인을 알 수 없었다.
  var pdfImages = true;
  var turns = [];
  var busy = false;
  var ctl = null;

  // 모델은 마크다운으로 답한다. 그대로 두면 |---|---| 가 글자로 보인다.
  // 표는 표로, 목록은 목록으로 그린다 - 연도별 비교는 표가 아니면 안 읽힌다.
  // 답은 바깥에서 온 텍스트이므로 무엇을 그리든 먼저 이스케이프한다.
  function inlineMd(s){
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function isTableRow(s){ return /^\s*\|.*\|\s*$/.test(s); }
  function isTableSep(s){ return /^\s*\|[\s:\-|]+\|\s*$/.test(s) && s.indexOf('-') !== -1; }
  function tableCells(s){
    return s.trim().replace(/^\|/, '').replace(/\|$/, '').split('|')
            .map(function(c){ return c.trim(); });
  }
  var BULLET = /^\s*([-*+·◦∙・]|\d+[.)])\s+/;

  function fmt(text){
    var lines = String(text == null ? '' : text).split('\n');
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];

      // 표: 머리줄 + 구분줄이 이어질 때만 표로 본다
      if (isTableRow(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var head = tableCells(line);
        i += 2;
        var body = [];
        while (i < lines.length && isTableRow(lines[i])) { body.push(tableCells(lines[i])); i++; }
        out.push('<div class="ans-table-wrap"><table class="ans-table"><thead><tr>' +
          head.map(function(c){ return '<th>' + inlineMd(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          body.map(function(r){
            return '<tr>' + r.map(function(c){ return '<td>' + inlineMd(c) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>');
        continue;
      }

      // 제목
      var mh = line.match(/^\s*(#{1,4})\s+(.*)$/);
      if (mh) {
        out.push('<div class="ans-h">' + inlineMd(mh[2]) + '</div>');
        i++; continue;
      }

      // 인용 (원문 발췌에 쓰인다)
      if (/^\s*>\s?/.test(line)) {
        var quoted = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          quoted.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push('<div class="ans-quote">' + quoted.map(inlineMd).join('<br>') + '</div>');
        continue;
      }

      // 목록
      if (BULLET.test(line)) {
        var items = [];
        while (i < lines.length && BULLET.test(lines[i])) {
          items.push(lines[i].replace(BULLET, '')); i++;
        }
        out.push('<ul class="ans-ul">' +
          items.map(function(t){ return '<li>' + inlineMd(t) + '</li>'; }).join('') + '</ul>');
        continue;
      }

      if (!line.trim()) { i++; continue; }

      // 문단 - 이어지는 보통 줄을 묶는다
      var para = [];
      while (i < lines.length && lines[i].trim() && !isTableRow(lines[i]) &&
             !/^\s*(#{1,4})\s+/.test(lines[i]) && !/^\s*>\s?/.test(lines[i]) &&
             !BULLET.test(lines[i])) {
        para.push(lines[i]); i++;
      }
      out.push('<div class="ans-p">' + para.map(inlineMd).join('<br>') + '</div>');
    }

    return out.join('') || '<div class="ans-p"></div>';
  }

  function errorCopy(code){
    switch (code) {
      case 'no_engine': return '답을 만들 AI를 찾지 못했습니다. 서버를 켠 터미널의 안내를 확인해 주세요.';
      case 'rate_limited': return '요청이 너무 잦습니다. 잠시 후 다시 시도해 주세요.';
      case 'session_expired': return 'claude.ai에 다시 로그인한 뒤 시도해 주세요.';
      case 'refused': return '이 질문에는 답할 수 없습니다. 다르게 물어봐 주세요.';
      case 'empty_completion': return '답을 만들지 못했습니다. 질문을 더 구체적으로 적어 주세요.';
      case 'prompt_too_large': return '대화가 너무 길어졌습니다. 새 질문으로 다시 시작해 주세요.';
      case 'cancelled': return null;
      default: return '연결에 문제가 있었습니다. 잠시 후 다시 시도해 주세요.';
    }
  }

  function setBusy(on){
    busy = on;
    chatSend.disabled = on;
    chatSend.style.opacity = on ? '.5' : '';
    chatStop.hidden = !on;
  }

  async function ask(question){
    if (busy || !serverReady) return;
    var q = String(question || '').trim();
    if (!q) return;
    chatBox.value = '';

    turns.push({ role: 'user', content: q });
    // 대화가 길어지면 오래된 것부터 버린다(지시문 턴은 매 호출마다 새로 앞에 붙인다).
    while (turns.length > 8) turns.shift();

    var rs = newResultScreen();
    var bubble = rs.bubble;
    var trace = rs.trace;
    bubble.classList.add('pending');
    bubble.innerHTML = '<div class="skeleton" aria-hidden="true">' +
      '<span class="sk-line"></span><span class="sk-line"></span>' +
      '<span class="sk-table"></span><span class="sk-line short"></span></div>';

    var qItem = addQuestionItem(q, rs.screen);

    function note(label, bad){
      var chip = document.createElement('span');
      chip.className = 'tool-chip' + (bad ? ' err' : '');
      chip.textContent = label;
      trace.appendChild(chip);
    }

    ctl = new AbortController();
    setBusy(true);
    var first = true;
    try {
      var res = await askServer(turns, { signal: ctl.signal });
      if (first) { bubble.classList.remove('pending'); first = false; }
      (res.tools || []).forEach(function(t){ note(t); });
      bubble.classList.remove('pending');
      bubble.innerHTML = fmt(res.text);
      turns.push({ role: 'assistant', content: res.text });
      if (res.truncated) note('답이 길어 잘렸습니다', true);
      settleQuestionItem(qItem, true);
      if (res.warning) note(res.warning, true);
      renderSources(rs.screen, res.sources || []);
    } catch (e) {
      var kept = e && e.text ? e.text : '';
      var copy = errorCopy(e && e.code);
      bubble.classList.remove('pending');
      if (kept) {
        bubble.innerHTML = fmt(kept);
        if (copy) note(copy, true);
        settleQuestionItem(qItem, false);
      } else if (copy) {
        bubble.classList.add('pending');
        bubble.textContent = copy;
        settleQuestionItem(qItem, false);
      } else {
        // 아무 내용도 없이 끝난 요청(중지 등)이면 목록에 흔적을 남기지 않는다.
        dropQuestionItem(qItem, rs.screen);
        activateLastOrEmpty();
      }
      // 실패한 턴은 대화에서 빼서 다음 질문이 깨끗하게 시작하도록 한다.
      if (turns.length && turns[turns.length - 1].role === 'user') turns.pop();
    } finally {
      setBusy(false);
      ctl = null;
    }
  }

  chatSend.addEventListener('click', function(){ ask(chatBox.value); });
  chatStop.addEventListener('click', function(){ if (ctl) ctl.abort(); });
  chatBox.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(chatBox.value); }
  });

  function disableAsk(message){
    askUnavailable.innerHTML = message;
    askUnavailable.hidden = false;
    chatBox.disabled = true;
    chatSend.disabled = true;
    chatSend.style.opacity = '.5';
    chatHint.textContent = '';
  }

  // 질문을 받고 답하는 곳은 이 서버 하나다. 페이지는 도구를 돌리지 않고
  // /ask 로 넘기기만 한다 - 어디서 열든 같은 코드가 같은 답을 낸다.
  function askServer(turns, opts){
    return fetch('ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Bridge-Guide': '1' },
      body: JSON.stringify({ turns: turns }),
      signal: opts && opts.signal
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d.error) throw { code: d.code || 'upstream_error', message: d.error };
      return d;
    }).catch(function(e){
      if (e && e.name === 'AbortError') throw { code: 'cancelled', message: '중지' };
      throw e;
    });
  }

  (async function initAsk(){
    if (location.protocol !== 'http:' && location.protocol !== 'https:') {
      disableAsk('<b>이 페이지는 파일로 열면 동작하지 않습니다.</b> ' +
                 '저장소 폴더에서 <code>python 서버.py</code> 를 실행해 열어 주세요.');
      return;
    }
    try {
      var probe = await fetch('_engine', { cache: 'no-store' });
      var info = probe.ok ? await probe.json() : null;
      if (info && info.ok) {
        serverReady = true;
        pdfImages = info.pdf_images !== false;
        return;
      }
      disableAsk('<b>답을 만들 AI를 찾지 못했습니다.</b> ' +
                 'Claude Code를 설치해 로그인하거나, ANTHROPIC_API_KEY · ' +
                 'GEMINI_API_KEY · OPENAI_API_KEY 중 하나를 넣고 서버를 다시 켜 주세요. ' +
                 '<code>python 서버.py --engines</code> 로 무엇이 필요한지 볼 수 있습니다.');
    } catch (e) {
      disableAsk('<b>서버에 연결하지 못했습니다.</b> ' +
                 '<code>python 서버.py</code> 가 켜져 있는지 확인해 주세요.');
    }
  })();

  // ---------------- 시작할 때 ----------------
  // /bridge-guide 세굴  ->  ?q=세굴 로 열린다. 엔진이 붙는 대로 바로 물어본다.
  try {
    var qp = new URLSearchParams(location.search).get('q');
    if (qp) {
      chatBox.value = qp;
      var 시도 = 0;
      var 대기 = setInterval(function(){
        if (serverReady) { clearInterval(대기); ask(qp); }
        else if (++시도 > 50) { clearInterval(대기); }   // 10초까지만 기다린다
      }, 200);
    }
  } catch (e) { /* URLSearchParams가 막히면 그냥 빈 화면으로 연다 */ }
})();
</script>
